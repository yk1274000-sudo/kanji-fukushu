@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:1.45rem;line-height:1.35;margin:0;text-wrap:balance}
h2{font-size:1.1rem;margin:0}
p{margin:0}

.sheet{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
button{font:inherit;color:inherit;cursor:pointer;border-radius:6px}

.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.rev{background:var(--pen-soft);color:var(--ink);border:1px solid var(--pen)}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--sub);text-decoration:underline;font-size:.85rem;align-self:flex-start}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.set{background:var(--paper);border:1.5px solid var(--line);padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.set b{font-size:1rem}
.set span{font-size:.76rem;color:var(--sub);font-variant-numeric:tabular-nums}
.set.done{border-color:var(--ok)}
.set.hasx{border-color:var(--pen)}
ol.qs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
ol.qs li{display:grid;grid-template-columns:2.2em 1fr;gap:4px 6px;padding:12px 0;border-bottom:1px dashed var(--line)}
ol.qs li:last-child{border-bottom:0}
.num{font-family:var(--f-q);font-weight:600;color:var(--sub);font-variant-numeric:tabular-nums}
.sent{font-family:var(--f-q);font-size:1.12rem;line-height:1.9;min-width:0}
.sent u{font-weight:600;text-decoration-color:var(--acc);text-decoration-thickness:2px;text-underline-offset:5px}
.ans{grid-column:2;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.kanji{font-family:var(--f-q);font-size:1.7rem;font-weight:600;color:var(--pen);line-height:1.3}
.judge{display:flex;gap:6px;margin-left:auto}
.judge button{width:44px;height:40px;border:1.5px solid var(--line);background:var(--paper);font-size:1.15rem;font-weight:700;color:var(--sub)}
.judge button.o[aria-pressed="true"]{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.judge button.x[aria-pressed="true"]{border-color:var(--pen);background:var(--pen-soft);color:var(--pen)}
table{width:100%;border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
textarea{font:inherit;font-size:.85rem;width:100%;padding:8px;border:1.5px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);resize:vertical}
.sync[data-mode="local"]{color:var(--pen)}
.btn:disabled{opacity:.45;cursor:default}
.score{font-family:var(--f-q);font-size:1.5rem;font-weight:600;color:var(--pen);font-variant-numeric:tabular-nums}
</style>

  if (writing) { pending = true; return; }
  writing = true;
  try { await DOC.set({ m: D.m, log: D.log, updatedAt: Date.now() }); SYNC = "保存しました（ログインしている端末ならどれでも続きができます）"; }
  catch(e) { SYNC = "保存できませんでした。通信を確認してください"; }
  writing = false; showSync();
  if (pending) { pending = false; pushCloud(); }
}
function save() { const ok = saveLocal(); if (!DOC && !ok) SYNC = "この画面ではブラウザに保存できません。引き継ぎコードを使ってください"; pushCloud(); showSync(); }
function showSync() { document.querySelectorAll(".sync").forEach(el => { el.textContent = SYNC; el.dataset.mode = MODE; }); }
function syncLine() { return '<p class="note sync" data-mode="' + MODE + '">' + esc(SYNC) + '</p>'; }

(async () => {
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e) {}
  try {
    const db = window.claude && await window.claude.use("db");
    if (!db) {
      MODE = "local";
      SYNC = navigator.standalone || matchMedia("(display-mode: standalone)").matches ? "この端末に保存しています。ときどき「引き継ぎコード」をコピーしておくと安心です" : "この端末に保存しています。消えないように、Safariの共有ボタン→「ホーム画面に追加」から開いてください";
      return showSync();
    }
    DOC = db.doc("progress/main");
    const snap = await DOC.get();
    const remote = snap.exists ? { m: snap.data().m || snap.data().marks || {}, log: snap.data().log || [] } : { m: {}, log: [] };
    const before = JSON.stringify(remote);
    D = merge(D, remote);
    saveLocal();
    MODE = "cloud"; SYNC = "保存しました（ログインしている端末ならどれでも続きができます）";
    if (JSON.stringify({ m: D.m, log: D.log }) !== before) pushCloud();
    if (S) render(); else home();
  } catch(e) { MODE = "local"; SYNC = "保存先につながらないため、この端末だけに保存しています"; showSync(); }
})();

function home() {
  S = null;
  const w = wrong(), done = Q.filter(q => D.m[q.id]).length, ok = Q.filter(q => D.m[q.id] === "o").length;
  let h = '<header class="stack"><p class="eyebrow">漢字ノートと学校のテストから ／ 全 ' + Q.length + ' 問</p><h1>まちがえた漢字　復習テスト</h1>' +
    '<p class="note">線を引いたカタカナを漢字に直して、ノートに書きましょう。書き終わったら「答えを見る」で丸つけをします。</p>' +
    '<p class="note">丸つけした問題 ' + done + ' / ' + Q.length + '　（○ ' + ok + '・× ' + w.length + '）</p>' + syncLine() + '</header>';
  if (w.length) h += '<button class="btn rev" data-wrong>×の問題だけテストする（' + w.length + ' 問）</button>';
  h += '<div class="sets">';
  for (let i = 0; i < SETS; i++) {
    const qs = setQs(i), o = qs.filter(q => D.m[q.id] === "o").length, x = qs.filter(q => D.m[q.id] === "x").length, L = lastLog(i);
    h += '<button class="set' + (x ? " hasx" : o === qs.length ? " done" : "") + '" data-set="' + i + '"><b>第' + (i + 1) + '回' + (L ? ' ✓' : '') + '</b><span>' +
      (i * PER + 1) + '〜' + (i * PER + qs.length) + '</span><span>' + (L ? fmtDate(L.t) + '　○' + L.o + ' ×' + L.x : (o + x ? "とちゅう ○" + o + " ×" + x : "まだ")) + '</span></button>';
  }
  h += '</div>';
  const recent = D.log.slice(-10).reverse();
  h += '<section class="sheet"><h2>やった記録</h2>' + (recent.length
    ? '<table><thead><tr><th>日時</th><th>回</th><th>結果</th></tr></thead><tbody>' + recent.map(e => '<tr><td>' + fmtDate(e.t) + '</td><td>' + (e.k === -1 ? "×の問題" : "第" + (e.k + 1) + "回") + '</td><td>○' + e.o + ' ×' + e.x + '</td></tr>').join("") + '</tbody></table>'
    : '<p class="note">まだ記録はありません。テストの丸つけが終わったら「結果を記録する」をおしましょう。</p>') + '</section>';
  h += '<section class="sheet"><h2>引き継ぎコード</h2><p class="note">ほかの端末に記録をうつすときや、記録が消えたときのために使います。コードをコピーしてメモなどに残し、別の端末で「コードから読みこむ」にはりつけます。</p>' +
    '<button class="btn ghost" data-copy>コードをコピーする</button>' +
    '<textarea id="code" rows="3" placeholder="ここにコードをはりつけ"></textarea>' +
    '<button class="btn ghost" data-import>コードから読みこむ</button><p class="note" id="codemsg"></p></section>';
  app.innerHTML = h;
  window.scrollTo(0, 0);
}

function test(list, title, k) { S = { list, title, k, logged: false }; S.shown = false; render(); window.scrollTo(0, 0); }

function render() {
  const o = S.list.filter(q => D.m[q.id] === "o").length, x = S.list.filter(q => D.m[q.id] === "x").length, all = o + x === S.list.length;
  let h = '<button class="linkbtn" data-home>← 一覧にもどる</button><section class="sheet"><div class="row"><h2>' + S.title + '</h2>' +
    (S.shown ? '<span class="score">○ ' + o + '　× ' + x + '</span>' : '<span class="note">' + S.list.length + ' 問</span>') + '</div>' +
    '<p class="note">' + (S.shown ? "ノートの答えとくらべて、○ か × をおしましょう。とめ・はね・はらい、送りがなも見ます。" : "線を引いたカタカナを漢字に直して、番号といっしょにノートに書きましょう。") + '</p><ol class="qs">';
  S.list.forEach((q, i) => {
    h += '<li><span class="num">' + (i + 1) + '</span><span class="sent">' + sent(q.s) + '</span>';
    if (S.shown) h += '<div class="ans"><span class="kanji">' + esc(q.a) + '</span><span class="judge">' +
      '<button class="o" data-j="o" data-id="' + q.id + '" aria-pressed="' + (D.m[q.id] === "o") + '" aria-label="正解">○</button>' +
      '<button class="x" data-j="x" data-id="' + q.id + '" aria-pressed="' + (D.m[q.id] === "x") + '" aria-label="まちがい">×</button></span></div>';
    h += '</li>';
  });
  h += '</ol>';
  if (!S.shown) h += '<button class="btn" data-show>答えを見る</button>';
  else {
    h += S.logged ? '<p class="note">記録しました。</p>' : '<button class="btn" data-log' + (all ? '' : ' disabled') + '>結果を記録する' + (all ? '' : '（全部の ○× をつけてから）') + '</button>';
    h += syncLine();
    if (S.k != null && S.k + 1 < SETS) h += '<button class="btn ghost" data-set="' + (S.k + 1) + '">第' + (S.k + 2) + '回へ進む</button>';
    h += '<button class="btn ghost" data-home>一覧にもどる</button>';
  }
  app.innerHTML = h + '</section>';
}

function copyCode() {
  const code = btoa(unescape(encodeURIComponent(JSON.stringify(D))));
  const ta = document.getElementById("code"), msg = document.getElementById("codemsg");
  ta.value = code;
  const fallback = () => { ta.focus(); ta.select(); msg.textContent = "コードを選んだので、長おしでコピーしてください"; };
  try { navigator.clipboard.writeText(code).then(() => { msg.textContent = "コピーしました。メモなどにはりつけて残しましょう"; }, fallback); } catch(e) { fallback(); }
}
function importCode() {
  const ta = document.getElementById("code"), msg = document.getElementById("codemsg");
  try {
    const d = JSON.parse(decodeURIComponent(escape(atob(ta.value.trim()))));
    if (!d || typeof d.m !== "object") throw 0;
    D = merge(D, { m: d.m, log: d.log || [] }); save(); home();
    document.getElementById("codemsg").textContent = "読みこみました";
  } catch(e) { msg.textContent = "コードが読めませんでした。全部コピーできているか確かめてください"; }
}

app.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t || t.disabled) return;
  if ("home" in t.dataset) return home();
  if (t.dataset.set != null) { const i = Number(t.dataset.set); return test(setQs(i), "第" + (i + 1) + "回", i); }
  if ("wrong" in t.dataset) return test(wrong(), "×の問題", -1);
  if ("show" in t.dataset) { S.shown = true; return render(); }
  if ("copy" in t.dataset) return copyCode();
  if ("import" in t.dataset) return importCode();
  if ("log" in t.dataset) {
    const o = S.list.filter(q => D.m[q.id] === "o").length, x = S.list.filter(q => D.m[q.id] === "x").length;
    D.log.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), k: S.k, t: Date.now(), o, x, n: S.list.length });
    S.logged = true; save(); const y = window.scrollY; render(); window.scrollTo(0, y); return;
  }
  if (t.dataset.j) { const y = window.scrollY; D.m[t.dataset.id] = t.dataset.j; save(); render(); window.scrollTo(0, y); }
});
home();
</script>
</body>
</html>
